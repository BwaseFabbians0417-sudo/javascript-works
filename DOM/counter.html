<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
</head>
<body style="margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center;">
    <div class="container" style="text-align: center;">
        <p id="display">0</p>
        <button id="btn-dec" style="background-color: purple; color: white;">-</button>
        <button id="btn-inc" style="background-color: red; color: white;">+</button>
        <button id="btn-res" style="background-color: aqua;">Reset</button>
    </div>
<script src="counter.js"></script>    
</body>
</html>
